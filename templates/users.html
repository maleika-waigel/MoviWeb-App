<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutzerübersicht – MoviWebApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>MoviWebApp</h1>
    </header>

    <main>
        <h2>Nutzerübersicht</h2>

        <section class="user-list">
            {% for user in users %}
                <article class="user-card">
                    <h3>{{ user.name }}</h3>
                    <p>Nutzer-ID: {{ user.id }}</p>
                </article>
            {% else %}
                <p class="empty-message">Noch keine Nutzer vorhanden.</p>
            {% endfor %}
        </section>
    </main>

</body>
</html>
