{% extends "base.html" %}
{% block content %}

<h1>Users</h1>

<section class="user-list">
    {% for user in users %}
        <article class="user-card">
            <h3>{{ user.name }}</h3>
            <a href="{{ url_for('get_user_movies', user_id=user.id) }}" class="btn">View Movies</a>
        </article>
    {% else %}
        <p class="empty-message">No users yet.</p>
    {% endfor %}
</section>

<div class="add_content new_user">
    <h3>Add New User</h3>
    <form action="{{ url_for('add_user') }}" method="post">
        <div class="add_content_input add-user-input">
            <input type="text" id="name" name="name" placeholder="User name" required><button type="submit">Add User</button>
        </div>

    </form>
</div>

{% endblock %}
